name: Build ARM32 Static Binary

on:
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler + static libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Clone and build llama.cpp (static)
        run: |
          git clone --depth 1 --branch b10622 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --config Release -j$(nproc)
          echo "=== Build results ==="
          ls -lh build/bin/llama-server
          file build/bin/llama-server
      - name: Package binary only (static, no shared libs needed)
        run: |
          cd /tmp/llama.cpp/build/bin
          tar -czf /tmp/llama-server-arm-linux.tar.gz llama-server
          ls -lh /tmp/llama-server-arm-linux.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-arm-linux-static
          path: /tmp/llama-server-arm-linux.tar.gz
