name: Build ARM32 Binary

on:
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++-arm-linux-gnueabihf
      - name: Clone llama.cpp
        run: git clone --depth 1 --branch b10622 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
      - name: Build for ARM32
        run: |
          cd /tmp/llama.cpp
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF
          cmake --build build --config Release -j$(nproc)
          echo "=== Build output ==="
          ls -la build/bin/llama-server || echo "Binary not found in build/bin/"
          find build -name "llama-server" -type f
          file build/bin/llama-server || echo "Cannot check file type"
      - name: Package
        run: |
          cd /tmp/llama.cpp
          mkdir -p arm32
          cp build/bin/llama-server arm32/
          cd arm32
          file llama-server
          ls -lh llama-server
          tar -czf llama-server-arm-linux.tar.gz llama-server
          ls -lh llama-server-arm-linux.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-arm-linux
          path: /tmp/llama.cpp/arm32/llama-server-arm-linux.tar.gz
