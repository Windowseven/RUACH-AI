# RUACH runtime registry
#
# Source of truth for local inference runtime compatibility metadata.
# The application never hardcodes runtime logic outside the adapter layer.

[runtimes.llama_cpp]
name = "llama.cpp"
interface = "local_http_server"        # llama-server, localhost only
server_binary = "llama-server"
status = "primary"                     # primary | optional_future
acquisition = "on_device_source_build" # approved MVP strategy; a trusted prebuilt
                                       # artifact may replace this only with explicit
                                       # architectural approval
supported_architectures = { arm64 = "supported", arm32 = "experimental", x86_64 = "experimental", x86 = "unknown" }
pin_policy = "release_tag_and_commit_recorded_at_install"
source_url = "https://github.com/ggml-org/llama.cpp"
notes = """
ARM32 status is experimental: one device (itel A6611L, armv7l) is under
validation. Do not claim support until its build + benchmark are recorded.
Ollama is deliberately absent: not an MVP dependency; may only appear here
later as an optional_future entry behind the same InferencePort.
"""
