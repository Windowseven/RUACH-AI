# RUACH capability thresholds — PROVISIONAL CALIBRATION VALUES
#
# Every number here is a placeholder heuristic. They must be replaced with
# benchmark-derived values as real device data accumulates (docs/10 §6).
# Nothing in this file is an architectural guarantee.

[memory]
# Reserve for Android OS, Termux, Python, FastAPI, SQLite and the RUACH process.
# Provisional value; NOT a universal Android constant.
reserve_bytes = 576716800            # ~550 MiB

# Estimated context/KV cache requirement for the initial candidate models.
kv_cache_estimate_bytes = 134217728  # ~128 MiB

# Safety margin applied on top of reserves, as percent of available RAM.
margin_percent = 15

[tiers]
# Classification uses AVAILABLE RAM (not total). Upper bounds are exclusive;
# anything above balanced_max is "performance".
light_max = 2147483648               # < 2 GiB available
balanced_max = 6442450944            # < 6 GiB available
