[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruach-backend"
version = "0.1.0"
description = "RUACH local AI workspace - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "black>=24.8",
    "ruff>=0.6",
    "mypy>=1.11",
]
e2e = [
    "playwright>=1.45",
    "pytest-playwright>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Alembic revision templates use typing.Sequence / Optional by convention.
"backend/migrations/**" = ["UP007", "UP035", "I001"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
